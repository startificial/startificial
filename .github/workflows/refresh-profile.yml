name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_activity.py'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render charts from public data
        run: python scripts/refresh_activity.py
      - name: Save updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-light.svg assets/activity-dark.svg assets/activity-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile activity'
            git push
          fi
